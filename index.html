<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escuta Clara — Teste Auditivo Experimental</title>
  <style>
    :root { --accent: #2563eb; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; margin: 0; color: #1e293b;
      background:
        radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 60%),
        radial-gradient(1000px 500px at 100% 110%, #ccfbf1 0%, transparent 60%),
        linear-gradient(180deg, #f0f9ff 0%, #ffffff 50%, #f0fdfa 100%);
      background-attachment: fixed;
    }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
      background-image: radial-gradient(#1e40af 1px, transparent 1px); background-size: 24px 24px; }
    #app { max-width: 720px; margin: 2.5rem auto; padding: 2rem; }
    .card {
      background: rgba(255,255,255,.85); backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0; padding: 1.6rem; border-radius: 18px; margin: 1rem 0;
      box-shadow: 0 10px 30px rgba(30,64,175,.08);
    }
    h1 { color: #1e3a8a; font-size: 2rem; margin: 0 0 .5rem; }
    h2 { color: #1e3a8a; }
    h3 { color: #0f766e; }
    button {
      padding: .75rem 1.4rem; margin: .35rem; font-size: 1rem; border: none;
      border-radius: 12px; background: linear-gradient(135deg,#2563eb,#0ea5e9); color:#fff;
      cursor: pointer; font-weight: 600; box-shadow: 0 4px 12px rgba(37,99,235,.25);
      transition: transform .1s, box-shadow .2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,.3); }
    button:active { transform: translateY(0); }
    .disclaimer { font-size: .85rem; color: #64748b; }
    table { width:100%; border-collapse: collapse; }
    th, td { padding: .6rem; border: 1px solid #e2e8f0; }
    th { background: #eff6ff; color:#1e3a8a; }
    ul { text-align: left; }
    input[type=range] { width: 100%; }
    #app { max-width: 640px; margin: 2rem auto; padding: 1.5rem; }
    .card {
      background: #fff; border: 1px solid #e5e7eb; padding: 1.2rem;
      border-radius: 12px; margin: 1rem 0; box-shadow: 0 4px 12px rgba(0,0,0,.06);
    }
    button {
      padding: .7rem 1.2rem; margin: .3rem; font-size: 1rem; border: none;
      border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer;
    }
    button:hover { opacity: .9; }
    .disclaimer { font-size: .85rem; color: #6b7280; }
    h1 { color: #1e3a8a; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
